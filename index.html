<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ターゲット1800 オンライン対戦</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; padding: 30px; }
    .box { max-width: 600px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; }
    button { padding: 12px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin: 5px; background: #facc15; color: #000; }
    textarea { width: 100%; height: 70px; margin-top: 10px; background: #0f172a; color: #38bdf8; border: 1px solid #334155; border-radius: 6px; padding: 8px; box-sizing: border-box; }
    .hidden { display: none; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .choice { background: #334155; color: #fff; width: 100%; margin: 0; }
  </style>
</head>
<body>
<div class="box">
  <h2>ターゲット1800 オンライン対戦</h2>
  <div id="lobby">
    <button id="b-host">部屋を作る（ホスト）</button>
    <button id="b-guest" style="background:#38bdf8;">部屋に入る（ゲスト）</button>
    <div id="p-host" class="hidden">
      <p>① 下の招待コードをコピーして相手に送る</p>
      <textarea id="t-offer" readonly></textarea>
      <p>② 相手の参加コードを貼って接続</p>
      <textarea id="t-ans-in" placeholder="ここに貼り付け"></textarea>
      <button id="b-conn">接続して開始</button>
    </div>
    <div id="p-guest" class="hidden">
      <p>① 相手の招待コードを貼って生成</p>
      <textarea id="t-off-in" placeholder="ここに貼り付け"></textarea>
      <button id="b-make">参加コード生成</button>
      <p>② 下の参加コードを相手に送り返す</p>
      <textarea id="t-ans" readonly></textarea>
    </div>
    <p id="msg" style="color:#4ade80;">役割を選んでください</p>
  </div>
  <div id="game" class="hidden">
    <div style="display:flex;justify-content:space-between;font-size:20px;font-weight:bold;">
      <span style="color:#38bdf8;">自分: <span id="s1">0</span></span>
      <span id="qnum">1/10</span>
      <span style="color:#f43f5e;">相手: <span id="s2">0</span></span>
    </div>
    <h1 id="word" style="font-size:40px;color:#facc15;margin:20px 0;">READY</h1>
    <div id="opts" class="grid"></div>
    <p id="gmsg"></p>
  </div>
</div>
<script>
const words = [
  ["abandon","〜を捨てる","〜を吸収する","〜を称賛する","〜を加速させる"],
  ["absorb","〜を吸収する","〜を廃止する","〜を適応させる","〜を避難させる"],
  ["accomplish","〜を成し遂げる","〜を伴う","〜を蓄積する","〜を非難する"],
  ["accurate","正確な","急性の","十分な","人工の"],
  ["acquire","〜を習得する","〜を要求する","〜を調査する","〜を賞賛する"],
  ["adapt","適応する","〜を採用する","〜を崇拝する","〜を前進させる"],
  ["adequate","十分な","隣接した","進歩した","熱心な"],
  ["affection","愛情","影響","苦痛","親和性"],
  ["alter","〜を変える","〜を交互にする","〜を警告する","〜を割り当てる"],
  ["ambitious","野心的な","曖昧な","熱心な","匿名の"]
];
let pc, dc, host=false, qs=[], idx=0, s1=0, s2=0, lock=false, miss=false;
const $ = id => document.getElementById(id);

$("b-host").onclick = async () => {
  host = true;
  $("p-host").classList.remove("hidden");
  $("p-guest").classList.add("hidden");
  $("msg").textContent = "コード生成中...";
  pc = new RTCPeerConnection({iceServers:[{urls:"stun:://google.com"}]});
  dc = pc.createDataChannel("g");
  setupDC();
  pc.onicecandidate = e => { if(!e.candidate) { $("t-offer").value = btoa(encodeURIComponent(JSON.stringify(pc.localDescription))); $("msg").textContent = "招待コードをコピーして送ってください"; } };
  await pc.setLocalDescription(await pc.createOffer());
};

$("b-guest").onclick = () => {
  host = false;
  $("p-guest").classList.remove("hidden");
  $("p-host").classList.add("hidden");
  $("msg").textContent = "招待コードを貼り付けてください";
  pc = new RTCPeerConnection({iceServers:[{urls:"stun:://google.com"}]});
  pc.ondatachannel = e => { dc = e.channel; setupDC(); };
};

$("b-make").onclick = async () => {
  try {
    await pc.setRemoteDescription(JSON.parse(decodeURIComponent(atob($("t-off-in").value.trim()))));
    pc.onicecandidate = e => { if(!e.candidate) { $("t-ans").value = btoa(encodeURIComponent(JSON.stringify(pc.localDescription))); $("msg").textContent = "参加コードをコピーして送り返してください"; } };
    await pc.setLocalDescription(await pc.createAnswer());
  } catch(e) { alert("コードが不正です"); }
};

$("b-conn").onclick = async () => {
  try { await pc.setRemoteDescription(JSON.parse(decodeURIComponent(atob($("t-ans-in").value.trim())))); }
  catch(e) { alert("コードが不正です"); }
};

function setupDC() {
  dc.onopen = () => {
    $("lobby").classList.add("hidden");
    $("game").classList.remove("hidden");
    if(host) {
      qs = [...words].sort(()=>Math.random()-0.5).map(w => ({en:w[0], ja:w[1], o:[w[1],w[2],w[3],w[4]].sort(()=>Math.random()-0.5)}));
      dc.send(JSON.stringify({t:"S", qs}));
      showQ();
    }
  };
  dc.onmessage = e => {
    const d = JSON.parse(e.data);
    if(d.t==="S") { qs=d.qs; showQ(); }
    if(d.t==="W" && !lock) { lock=true; s2+=10; $("s2").textContent=s2; $("gmsg").textContent="相手が正解！"; next(); }
    if(d.t==="M") { s2-=5; $("s2").textContent=s2; $("gmsg").textContent="相手がお手つき！"; }
  };
}

function showQ() {
  if(idx>=qs.length) { $("word").textContent = s1>s2?"勝利！":s1<s2?"敗北...":"引き分け"; $("opts").innerHTML=""; return; }
  lock=false; miss=false;
  const q = qs[idx];
  $("qnum").textContent = (idx+1)+"/"+qs.length;
  $("word").textContent = q.en;
  $("gmsg").textContent = "";
  $("opts").innerHTML = "";
  q.o.forEach(txt => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = txt;
    b.onclick = () => {
      if(lock || miss) return;
      if(txt===q.ja) { lock=true; s1+=10; $("s1").textContent=s1; $("gmsg").textContent="正解！"; dc.send(JSON.stringify({t:"W"})); next(); }
      else { miss=true; s1-=5; $("s1").textContent=s1; $("gmsg").textContent="お手つき！"; dc.send(JSON.stringify({t:"M"})); }
    };
    $("opts").appendChild(b);
  });
}
function next() { setTimeout(()=>{ idx++; showQ(); }, 1200); }
</script>
</body>
</html>
