<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ターゲット1800 オンライン対戦</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 640px;
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 { font-size: 22px; color: #facc15; margin-top: 0; }
    .box { background: #0f172a; padding: 18px; border-radius: 12px; margin-bottom: 14px; }
    .id-text {
      font-size: 24px;
      font-weight: bold;
      color: #38bdf8;
      background: #1e293b;
      padding: 8px 16px;
      border-radius: 8px;
      margin: 10px auto;
      display: inline-block;
      user-select: all;
    }
    input {
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      border: 2px solid #38bdf8;
      background: #1e293b;
      color: #fff;
      width: 220px;
      text-align: center;
    }
    button {
      background: #facc15;
      color: #0f172a;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 6px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .blue { background: #38bdf8; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #334155;
    }
    .score { font-size: 18px; font-weight: bold; padding: 8px 14px; border-radius: 8px; width: 35%; }
    .me { background: rgba(56,189,248,0.15); color: #38bdf8; border: 2px solid #38bdf8; }
    .opp { background: rgba(244,63,94,0.15); color: #f43f5e; border: 2px solid #f43f5e; }
    .word-box { background: #0f172a; padding: 20px; border-radius: 12px; margin: 16px 0; }
    .word { font-size: 38px; font-weight: bold; color: #facc15; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
    .choice { background: #334155; color: #fff; width: 100%; margin: 0; padding: 14px; }
    .msg { min-height: 24px; font-size: 15px; font-weight: bold; margin-top: 10px; color: #4ade80; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h1>ターゲット1800 オンライン対戦</h1>

  <div id="lobby">
    <div class="box">
      <div style="font-size:14px;color:#94a3b8;">▼ 部屋を作って相手を待つ（ホスト側）</div>
      <button id="btn-create" type="button">新しい部屋を作成する</button>
      <div id="host-area" class="hidden">
        <div style="font-size:13px;color:#cbd5e1;margin-top:6px;">この「合言葉」を相手に伝えてください</div>
        <div class="id-text" id="room-code-disp"></div>
      </div>
    </div>

    <div class="box">
      <div style="font-size:14px;color:#94a3b8;margin-bottom:8px;">▼ 相手の部屋に入る（ゲスト側）</div>
      <input type="text" id="join-code" placeholder="合言葉を入力">
      <button id="btn-join" class="blue" type="button">入室して対戦開始</button>
    </div>

    <div class="msg" id="lobby-msg" style="color:#94a3b8;">ボタンを押して部屋を作るか、合言葉を入れて入室してください</div>
  </div>

  <div id="game" class="hidden">
    <div class="header">
      <div class="score me">自分: <span id="s-me">0</span> 点</div>
      <div style="font-size:14px;color:#cbd5e1;" id="q-num">1 / 10</div>
      <div class="score opp">相手: <span id="s-opp">0</span> 点</div>
    </div>
    <div class="word-box">
      <div class="word" id="word-disp">READY</div>
    </div>
    <div class="grid" id="opts"></div>
    <div class="msg" id="game-msg">対戦中...</div>
    <button id="btn-rematch" class="hidden" type="button">もう一度対戦する</button>
  </div>
</div>

<script>
const words = [
  { en: "abandon", ja: "〜を捨てる", d: ["〜を吸収する", "〜を称賛する", "〜を加速させる"] },
  { en: "absorb", ja: "〜を吸収する", d: ["〜を廃止する", "〜を適応させる", "〜を避難させる"] },
  { en: "accomplish", ja: "〜を成し遂げる", d: ["〜を伴う", "〜を蓄積する", "〜を非難する"] },
  { en: "accurate", ja: "正確な", d: ["急性の", "十分な", "人工の"] },
  { en: "acquire", ja: "〜を習得する", d: ["〜を要求する", "〜を調査する", "〜を賞賛する"] },
  { en: "adapt", ja: "適応する", d: ["〜を採用する", "〜を崇拝する", "〜を前進させる"] },
  { en: "adequate", ja: "十分な", d: ["隣接した", "進歩した", "熱心な"] },
  { en: "affection", ja: "愛情", d: ["影響", "苦痛", "親和性"] },
  { en: "alter", ja: "〜を変える", d: ["〜を交互にする", "〜を警告する", "〜を割り当てる"] },
  { en: "ambitious", ja: "野心的な", d: ["曖昧な", "熱心な", "匿名の"] },
  { en: "analyze", ja: "〜を分析する", d: ["〜に麻酔をかける", "〜を公表する", "〜を予期する"] },
  { en: "ancient", ja: "古代の", d: ["不安な", "年間の", "明らかな"] },
  { en: "anticipate", ja: "〜を予期する", d: ["〜に参加する", "〜に謝罪する", "〜を適用する"] },
  { en: "apparent", ja: "明らかな", d: ["適切な", "熱心な", "横柄な"] },
  { en: "appreciate", ja: "〜に感謝する", d: ["〜に近づく", "〜を承認する", "〜を逮捕する"] }
];

// CORS対応・認証不要の公開KVストレージ（kvdb.io 公開バケット）
const BUCKET = "https://kvdb.io";
let roomUrl = "";
let isHost = false;
let timer = null;
let state = null;
let shownIdx = -1;
let locked = false;
let missed = false;

function makeQs() {
  const copy = [...words].sort(() => Math.random() - 0.5).slice(0, 10);
  return copy.map(w => ({
    en: w.en,
    ja: w.ja,
    opts: [w.ja, ...w.d].sort(() => Math.random() - 0.5)
  }));
}

async function saveState(obj) {
  await fetch(roomUrl, {
    method: "POST",
    body: JSON.stringify(obj)
  });
}

async function loadState() {
  const res = await fetch(roomUrl + "?t=" + Date.now());
  if (!res.ok) return null;
  return await res.json();
}

document.getElementById("btn-create").addEventListener("click", async () => {
  const msg = document.getElementById("lobby-msg");
  msg.textContent = "部屋を作成中...";
  msg.style.color = "#facc15";
  document.getElementById("btn-create").disabled = true;
  document.getElementById("btn-join").disabled = true;

  try {
    isHost = true;
    const code = Math.floor(10000 + Math.random() * 90000).toString();
    roomUrl = BUCKET + "/room_" + code;

    const initData = {
      status: "waiting",
      hScore: 0,
      gScore: 0,
      qIdx: 0,
      win: "",
      hMiss: false,
      gMiss: false,
      qs: makeQs()
    };

    await saveState(initData);
    state = initData;

    document.getElementById("room-code-disp").textContent = code;
    document.getElementById("host-area").classList.remove("hidden");
    msg.textContent = "合言葉「" + code + "」を相手に伝えてお待ちください...";
    msg.style.color = "#4ade80";

    startLoop();
  } catch (e) {
    msg.textContent = "通信エラー: " + e.message;
    msg.style.color = "#f43f5e";
    document.getElementById("btn-create").disabled = false;
    document.getElementById("btn-join").disabled = false;
  }
});

document.getElementById("btn-join").addEventListener("click", async () => {
  const msg = document.getElementById("lobby-msg");
  const code = document.getElementById("join-code").value.trim();
  if (!code) {
    msg.textContent = "合言葉（5桁の数字）を入力してください";
    msg.style.color = "#facc15";
    return;
  }

  msg.textContent = "入室中...";
  msg.style.color = "#38bdf8";
  document.getElementById("btn-create").disabled = true;
  document.getElementById("btn-join").disabled = true;

  try {
    isHost = false;
    roomUrl = BUCKET + "/room_" + code;
    const data = await loadState();
    if (!data || !data.qs) {
      throw new Error("部屋が見つかりません");
    }

    data.status = "playing";
    await saveState(data);
    state = data;

    document.getElementById("lobby").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");
    render();
    startLoop();
  } catch (e) {
    msg.textContent = "入室エラー: " + e.message;
    msg.style.color = "#f43f5e";
    document.getElementById("btn-create").disabled = false;
    document.getElementById("btn-join").disabled = false;
  }
});

function startLoop() {
  if (timer) clearInterval(timer);
  timer = setInterval(async () => {
    try {
      const latest = await loadState();
      if (!latest) return;

      if (isHost && latest.status === "playing" && document.getElementById("game").classList.contains("hidden")) {
        state = latest;
        document.getElementById("lobby").classList.add("hidden");
        document.getElementById("game").classList.remove("hidden");
        render();
        return;
      }

      if (!document.getElementById("game").classList.contains("hidden")) {
        state = latest;
        render();
      }
    } catch (e) {}
  }, 900);
}

function render() {
  if (!state) return;
  const myS = isHost ? state.hScore : state.gScore;
  const oppS = isHost ? state.gScore : state.hScore;
  document.getElementById("s-me").textContent = myS;
  document.getElementById("s-opp").textContent = oppS;

  if (state.qIdx >= state.qs.length) {
    document.getElementById("q-num").textContent = "終了";
    document.getElementById("opts").innerHTML = "";
    let resText = "引き分け！";
    if (myS > oppS) resText = "🏆 あなたの勝利！";
    if (oppS > myS) resText = "😢 相手の勝利...";
    document.getElementById("word-disp").textContent = resText;
    document.getElementById("game-msg").textContent = "最終スコア: 自分 " + myS + "点 vs 相手 " + oppS + "点";
    if (isHost) document.getElementById("btn-rematch").classList.remove("hidden");
    return;
  }

  document.getElementById("btn-rematch").classList.add("hidden");

  if (shownIdx !== state.qIdx) {
    shownIdx = state.qIdx;
    locked = false;
    missed = false;

    const q = state.qs[state.qIdx];
    document.getElementById("q-num").textContent = (state.qIdx + 1) + " / " + state.qs.length;
    document.getElementById("word-disp").textContent = q.en;
    document.getElementById("game-msg").textContent = "早押しで正解を選べ！";
    document.getElementById("game-msg").style.color = "#94a3b8";

    const box = document.getElementById("opts");
