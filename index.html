<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ターゲット1800 オンライン対戦</title>
  <style>
    body {
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Meiryo, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 { font-size: 22px; margin-top: 0; color: #facc15; }
    .lobby-box {
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    input[type="text"] {
      padding: 12px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      border: 2px solid #38bdf8;
      background: #1e293b;
      color: #fff;
      width: 220px;
      text-align: center;
    }
    button {
      background: #facc15;
      color: #0f172a;
      border: none;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px 4px;
    }
    button:hover:not(:disabled) { background: #fde047; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .guest-btn { background: #38bdf8; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #334155;
    }
    .score-box {
      font-size: 18px;
      font-weight: bold;
      padding: 10px 16px;
      border-radius: 10px;
      width: 35%;
    }
    .me-box { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 2px solid #38bdf8; }
    .opp-box { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 2px solid #f43f5e; }
    .word-area {
      margin: 20px 0;
      padding: 24px;
      background: #0f172a;
      border-radius: 12px;
    }
    .english-word { font-size: 42px; font-weight: bold; letter-spacing: 2px; margin: 8px 0; color: #facc15; }
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
    }
    .choice-btn {
      background: #334155;
      color: #f8fafc;
      padding: 16px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      border: 2px solid transparent;
      cursor: pointer;
      width: 100%;
      margin: 0;
    }
    .choice-btn:hover:not(:disabled) { background: #475569; border-color: #38bdf8; }
    .choice-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .status-msg {
      min-height: 26px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 12px;
      color: #4ade80;
    }
    .hidden { display: none !important; }
    @media (max-width: 600px) {
      .choices { grid-template-columns: 1fr; }
      .english-word { font-size: 32px; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>ターゲット1800 オンライン対戦</h1>

  <div id="lobby-screen">
    <div class="lobby-box">
      <div style="font-size: 14px; color: #94a3b8; margin-bottom: 10px;">
        対戦相手と同じ「合言葉（好きな英数字）」を入力してください
      </div>
      <input type="text" id="room-input" placeholder="例: 1234" maxlength="12">
      <div style="margin-top: 12px;">
        <button id="btn-create">部屋を作って待つ（ホスト）</button>
        <button id="btn-join" class="guest-btn">部屋に入る（ゲスト）</button>
      </div>
    </div>
    <div class="status-msg" id="lobby-status" style="color: #94a3b8;">合言葉を入れてボタンを押してください</div>
  </div>

  <div id="game-screen" class="hidden">
    <div class="header">
      <div class="score-box me-box">自分: <span id="my-score">0</span> 点</div>
      <div style="font-size: 14px; color: #cbd5e1;" id="q-progress">準備中</div>
      <div class="score-box opp-box">相手: <span id="opp-score">0</span> 点</div>
    </div>

    <div class="word-area">
      <div class="english-word" id="word-display">READY</div>
    </div>

    <div class="choices" id="choices-container"></div>

    <div class="status-msg" id="game-status">対戦中...</div>
    <button id="rematch-btn" class="hidden">もう一度対戦する</button>
  </div>
</div>

<script>
  const wordBank = [
    { en: "abandon", ja: "〜を捨てる、断念する", d: ["〜を吸収する", "〜を称賛する", "〜を加速させる"] },
    { en: "absorb", ja: "〜を吸収する、夢中にさせる", d: ["〜を廃止する", "〜を適応させる", "〜を避難させる"] },
    { en: "accomplish", ja: "〜を成し遂げる", d: ["〜を伴う", "〜を蓄積する", "〜を非難する"] },
    { en: "accurate", ja: "正確な、的確な", d: ["急性の、激しい", "十分な", "人工の"] },
    { en: "acquire", ja: "〜を習得する、得る", d: ["〜を要求する", "〜を調査する", "〜に賞賛を与える"] },
    { en: "adapt", ja: "適応する、〜を適合させる", d: ["〜を採用する", "〜を崇拝する", "〜を前進させる"] },
    { en: "adequate", ja: "十分な、適切な", d: ["隣接した", "進歩した", "熱心な"] },
    { en: "affection", ja: "愛情、好意", d: ["影響、作用", "苦痛、悩み", "親和性"] },
    { en: "alter", ja: "〜を変える、変わる", d: ["〜を交互に行う", "〜を警告する", "〜を割り当てる"] },
    { en: "ambitious", ja: "野心的な、大志を抱いた", d: ["曖昧な", "熱心な", "匿名（とくめい）の"] },
    { en: "analyze", ja: "〜を分析する", d: ["〜に麻酔をかける", "〜を公表する", "〜を予期する"] },
    { en: "ancient", ja: "古代の、昔からの", d: ["不安な", "年間（毎年）の", "明らかな"] },
    { en: "anticipate", ja: "〜を予期する、楽しみに待つ", d: ["〜に参加する", "〜に謝罪する", "〜を適用する"] },
    { en: "apparent", ja: "明らかな、外見上の", d: ["適切な", "熱心な", "横柄な"] },
    { en: "appreciate", ja: "〜に感謝する、真価を認める", d: ["〜に近づく", "〜を承認する", "〜を逮捕する"] }
  ];

  // 外部ライブラリ不要の標準WebSocket通信（無料の公開エコー/ブロードキャストサーバー利用）
  let ws = null;
  let roomName = "";
  let isHost = false;
  let myId = Math.random().toString(36).substring(2, 9);
  let questions = [];
  let currentIdx = 0;
  let myScore = 0;
  let oppScore = 0;
  let myMissed = false;
  let oppMissed = false;
  let roundLocked = false;

  function connectServer(asHost) {
    const code = document.getElementById("room-input").value.trim();
    if (!code) {
      alert("合言葉（例：1234）を入力してください");
      return;
    }

    isHost = asHost;
    roomName = "t1800-battle-" + code;
    document.getElementById("btn-create").disabled = true;
    document.getElementById("btn-join").disabled = true;
    document.getElementById("lobby-status").textContent = "通信サーバーに接続中...";
    document.getElementById("lobby-status").style.color = "#facc15";

    // 公開WebSocketブロードキャストサーバー（PieSocket Free Demo / SocketsBay代替の汎用WS）
    ws = new WebSocket("wss://://postman-echo.com");

    ws.onopen = () => {
      if (isHost) {
        document.getElementById("lobby-status").textContent = `合言葉「${code}」で待機中... 相手の入室を待っています`;
        document.getElementById("lobby-status").style.color = "#4ade80";
      } else {
        document.getElementById("lobby-status").textContent = `合言葉「${code}」に入室しました！ホストの開始を待っています...`;
        document.getElementById("lobby-status").style.color = "#38bdf8";
        sendMsg({ type: "JOIN" });
      }
    };

    ws.onerror = () => {
      document.getElementById("lobby-status").textContent = "ネットワーク制限により外部サーバーへ接続できませんでした";
      document.getElementById("lobby-status").style.color = "#f43f5e";
      document.getElementById("btn-create").disabled = false;
      document.getElementById("btn-join").disabled = false;
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.room !== roomName || data.sender === myId) return;
        handleMessage(data);
      } catch (e) {}
    };
  }

  function sendMsg(payload) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ room: roomName, sender: myId, ...payload }));
    }
  }

  function handleMessage(data) {
    if (data.type === "JOIN" && isHost) {
      startNewMatch();
    } else if (data.type === "START") {
      initMatch(data.questions);
    } else if (data.type === "WIN" && data.qIdx === currentIdx && !roundLocked) {
      roundLocked = true;
      oppScore += 10;
      updateScoreUI();
      disableAllButtons(true);
      document.getElementById("game-status").textContent = `相手が先に正解！ 正解は「${questions[currentIdx].ja}」`;
      document.getElementById("game-status").style.color = "#f43f5e";
      scheduleNextQuestion();
    } else if (data.type === "MISS" && data.qIdx === currentIdx) {
      oppMissed = true;
      oppScore -= 5;
      updateScoreUI();
      if (!myMissed) {
        document.getElementById("game-status").textContent = "相手がお手つき！（-5点）チャンス！";
        document.getElementById("game-status").style.color = "#4ade80";
      }
      checkBothMissed();
    } else if (data.type === "REMATCH" && isHost) {
      startNewMatch();
    }
  }

  function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  function startNewMatch() {
    const selected = shuffle([...wordBank]).slice(0, 10).map(q => ({
      en: q.en,
      ja: q.ja,
      options: shuffle([q.ja, ...q.d])
    }));
    sendMsg({ type: "START", questions: selected });
    initMatch(selected);
  }

  function initMatch(qList) {
    questions = qList;
    currentIdx = 0;
    myScore = 0;
    oppScore = 0;
    updateScoreUI();
    document.getElementById("lobby-screen").classList.add("hidden");
    document.getElementById("game-screen").classList.remove("hidden");
    document.getElementById("rematch-btn").classList.add("hidden");
    loadQuestion();
  }

  function loadQuestion() {
    if (currentIdx >= questions.length) {
      endGame();
      return;
    }

    myMissed = false;
    oppMissed = false;
    roundLocked = false;

    const q = questions[currentIdx];
    document.getElementById("q-progress").textContent = `第 ${currentIdx + 1} 問 / 全 ${questions.length} 問`;
    document.getElementById("word-display").textContent = q.en;
    document.getElementById("game-status").textContent = "早押しで正しい意味をタップ！";
    document.getElementById("game-status").style.color = "#94a3b8";
