function mk(){se("st");hs=1;solo=com=0;lv=$("lv").value;qNum=Number($("qCnt").value)||10;var c=String(Math.floor(10000+Math.random()*90000));tp="t18_"+c;$("rD").textContent=c;$("rI").classList.remove("hd");$("bH").disabled=$("bG").disabled=$("bC").disabled=$("lv").disabled=$("qCnt").disabled=1;lg("部屋を作成！入室待ち...");ls()}
function jn(){var c=$("in").value.trim();if(!c)return lg("5桁の合言葉を入力",1);se("st");hs=solo=com=0;tp="t18_"+c;$("bH").disabled=$("bG").disabled=$("bC").disabled=$("lv").disabled=$("qCnt").disabled=1;lg("接続中...");ls()}
function shf(a){var r=new Array(),c=a.slice();while(c.length){var j=Math.floor(Math.random()*c.length);r.push(c.splice(j,1).at(0))}return r}
function mapQ(arr){var isM=lv.startsWith("m"),isH=(lv==="h1"||lv==="h2"||lv==="ha");return arr.map(function(l){var p=l.split("|"),qTxt=(p.at(0)||"").trim(),ans=(p.at(1)||"").trim(),pool=isM?MA:isH?HA:D,opts=new Array(ans),guard=0;while(opts.length<4&&guard<200){guard++;var r=(pool.at(Math.floor(Math.random()*pool.length)).split("|").at(1)||"").trim();if(r&&opts.indexOf(r)<0)opts.push(r)}return{e:qTxt,j:ans,o:shf(opts),raw:l}})}
function nw(){var pl=lv==="e"?W1:lv==="h"?W2:lv==="m1"?M1:lv==="m2"?M2:lv==="m3"?M3:lv==="ma"?MA:lv==="h1"?H1:lv==="h2"?H2:lv==="ha"?HA:WM;LM=lv.startsWith("m")?10000:lv==="h"?4000:lv==="n"?6000:8000;qs=mapQ(shf(pl.slice()).slice(0,qNum));if(!com)tx("B",{q:qs,l:LM,v:lv,nm:myTag()});go()}
function startCom(){se("st");com=1;hs=solo=0;lv=$("lv").value;qNum=Number($("qCnt").value)||10;var nmMap={e:"初級",n:"中級",h:"上級",m1:"数ⅠA",m2:"数ⅡB",m3:"数ⅢC",ma:"数学全",h1:"古代中世",h2:"近世近代",ha:"日本史全"};oppName="🤖COM("+(nmMap[lv]||"中級")+")";nw()}
function startReview(){var sv=getSaved();if(!sv.length)return;se("st");solo=1;hs=com=0;LM=8000;qs=mapQ(shf(sv.slice()));go()}
function go(){$("lb").classList.add("hd");$("gm").classList.remove("hd");$("bR").classList.add("hd");$("bTop").classList.add("hd");$("rv").classList.add("hd");$("mLb").textContent=myTag();$("oLb").textContent=oppName;$("oppWrap").style.visibility=solo?"hidden":"visible";$("sBar").style.display=(solo||com)?"none":"flex";ix=mS=oS=0;wr=new Array();$("s1").textContent=$("s2").textContent=0;sh()}
function aw(q){for(var i=0;i<wr.length;i++)if(wr.at(i).e===q.e)return;wr.push(q);var sv=getSaved(),raw=q.raw||ALL_D.find(function(x){return x.indexOf(q.e+"|")===0});if(raw&&sv.indexOf(raw)<0){sv.push(raw);setSaved(sv)}}
function rmSaved(en){setSaved(getSaved().filter(function(x){return x.indexOf(en+"|")!==0}))}
function delResItem(en,btn){rmSaved(en);btn.textContent="消去済";btn.disabled=true;btn.style.background="#475569";se("st")}
function sh(){
  clearInterval(tI);
  clearTimeout(cI);
  ix = Number(ix) || 0;
  if(ix >= qs.length){
    if(!solo){
      var p = getPr();
      if(!com){
        if(mS > oS){ p.w++; p.st++; if(p.st > p.mx) p.mx = p.st; }
        else if(mS < oS){ p.l++; p.st = 0; }
      }
      p.pt += Math.max(0, mS);
      localStorage.setItem("t18_pr", JSON.stringify(p));
      ldProf();
    }
    if(solo || mS >= oS) se("wn"); else se("ng");
    $("tb").style.width = "0%";
    $("bSpeak").classList.add("hd");
    $("bDrop").classList.add("hd");
    $("wd").style.fontSize = "32px";
    $("wd").textContent = solo ? "🎉 復習完了！" : mS > oS ? "🏆 " + myTag() + "の勝利！" : mS < oS ? "😢 " + oppName + "の勝利..." : "引き分け！";
    $("op").innerHTML = "";
    $("gl").textContent = solo ? ("復習スコア: " + mS + "点（残り苦手: " + getSaved().length + "語）") : ("最終: " + myTag() + " " + mS + "点 vs " + oppName + " " + oS + "点");
    if(!solo) $("bR").classList.remove("hd");
    $("bTop").classList.remove("hd");
    $("rv").classList.remove("hd");
    $("rv").innerHTML = wr.length ? ("<b style='color:#facc15'>📝 振り返り（不要な問題は消去可）</b>" + wr.map(function(x){
      return "<div class='rv-row'><div><b>" + x.e + "</b>：" + x.j + "</div><button class='del-btn' onclick=\"delResItem('" + x.e.replace(/'/g,"") + "',this)\">苦手から消去</button></div>";
    }).join("")) : "<div style='color:#4ade80;font-weight:bold'>🎉 全問クリア！復習不要です！</div>";
    return;
  }

  lk = ms = cMs = 0;
  lB = 4;
  if(solo) $("bDrop").classList.remove("hd"); else $("bDrop").classList.add("hd");

  var q = qs.at(ix);
  var lbMap = {e:"初級", n:"中級", h:"上級", m1:"数ⅠA", m2:"数ⅡB", m3:"数ⅢC", ma:"数学全", h1:"古代中世", h2:"近世近代", ha:"日本史全"};
  var ln = solo ? "1人復習" : (lbMap[lv] || "中級");
  var isJp = q.e.length > 14 || /[^a-zA-Z\-]/.test(q.e);

  $("bSpeak").classList.toggle("hd", isJp);
  $("wd").style.fontSize = isJp ? "21px" : "32px";
  $("pg").textContent = "[" + ln + "] " + (ix + 1) + "/" + qs.length;
  $("wd").textContent = q.e;
  if(!isJp) speakWord(q.e);

  $("gl").textContent = solo ? "答えを選べ！（不要なら上の消去ボタン）" : "早押しで正解を選べ！";
  $("gl").style.color = "#94a3b8";
  $("op").innerHTML = "";

  shf(q.o).forEach(function(o){
    var b = document.createElement("button");
    b.className = "ch";
    b.textContent = o;
    b.onclick = function(){
      if(lk || ms) return;
      if(o === q.j){
        lk = 1;
        clearInterval(tI);
        clearTimeout(cI);
        se("ok");
        var bn = Math.max(0, Math.round(((LM - (Date.now() - qT)) / LM) * 10));
        var pt = 10 + bn;
        mS += pt;
        $("s1").textContent = mS;
        $("gl").textContent = "正解！(+" + pt + "点/速度+" + bn + ")";
        $("gl").style.color = "#38bdf8";
        ds(1);
        tx("W", {i:ix, p:pt});
        setTimeout(function(){ ix++; sh(); }, 1300);
      } else {
        ms = 1;
        se("ng");
        mS -= 5;
        $("s1").textContent = mS;
        $("gl").textContent = solo ? ("不正解！正解:" + q.j) : ("お手つき！（-5点）");
        $("gl").style.color = "#facc15";
        aw(q);
        ds(1);
        tx("M", {i:ix});
        if(solo){
          lk = 1;
          clearInterval(tI);
          setTimeout(function(){ ix++; sh(); }, 1500);
        } else if(com && cMs){
          lk = 1;
          clearInterval(tI);
          clearTimeout(cI);
          $("gl").textContent = "両方お手つき！正解:" + q.j;
          setTimeout(function(){ ix++; sh(); }, 1500);
        }
      }
    };
    $("op").appendChild(b);
  });

  qT = Date.now();
  $("tb").style.width = "100%";
  $("tb").style.backgroundColor = "#4ade80";

  if(com){
    var dl = lv.startsWith("m") ? (5500 + Math.random() * 3000) : (lv === "h1" || lv === "h2" || lv === "ha") ? (4500 + Math.random() * 2500) : lv === "e" ? (4500 + Math.random() * 2700) : lv === "h" ? (2400 + Math.random() * 1200) : (3500 + Math.random() * 1900);
    cI = setTimeout(function(){
      if(lk) return;
      if(Math.random() < (lv === "h" ? 0.1 : 0.22)){
        oppMiss();
      } else {
        var bn = Math.max(0, Math.round(((LM - (Date.now() - qT)) / LM) * 10));
        oppWin(10 + bn);
      }
    }, dl);
  }

  tI = setInterval(function(){
    var r = Math.max(0, LM - (Date.now() - qT));
    var pc = (r / LM) * 100;
    var sec = Math.ceil(r / 1000);
    $("tb").style.width = pc + "%";
    $("tb").style.backgroundColor = pc < 30 ? "#f43f5e" : pc < 60 ? "#facc15" : "#4ade80";
    if(sec <= 3 && sec < lB && sec > 0){ lB = sec; se("tk"); }
    if(r <= 0 && !lk){
      lk = 1;
      clearInterval(tI);
      clearTimeout(cI);
      se("ng");
      ds(1);
      aw(q);
      $("gl").textContent = "時間切れ！正解:" + q.j;
      setTimeout(function(){ ix++; sh(); }, 1500);
    }
  }, 50);
}
function ds(f){document.querySelectorAll(".ch").forEach(function(b){b.disabled=f})}
function re(){if(com)nw();else if(hs)nw();else{tx("R");$("gl").textContent="再戦リクエスト送信中..."}}
</script>
