<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ターゲット1800 オンライン対戦 DX</title>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px;box-sizing:border-box}
.box{width:100%;max-width:600px;background:#1e293b;padding:18px;border-radius:16px;text-align:center}
h1{font-size:20px;color:#facc15;margin:0 0 10px}
.panel{background:#0f172a;padding:12px;border-radius:10px;margin-bottom:10px}
input{padding:9px;font-size:17px;border-radius:8px;border:2px solid #38bdf8;background:#1e293b;color:#fff;width:140px;text-align:center}
button{background:#facc15;color:#000;border:none;padding:10px 16px;font-size:15px;font-weight:bold;border-radius:8px;cursor:pointer;margin:4px}
button:disabled{opacity:.45;cursor:not-allowed}
.blue{background:#38bdf8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.choice{background:#334155;color:#fff;width:100%;margin:0;padding:12px;font-size:14px}
.hide{display:none}
#log{font-size:14px;color:#4ade80;margin-top:6px;font-weight:bold;min-height:20px}
.bar-bg{width:100%;height:8px;background:#334155;border-radius:4px;overflow:hidden;margin:8px 0}
.bar-fill{width:100%;height:100%;background:#4ade80}
.s-bar{display:flex;justify-content:center;gap:4px;margin-top:8px;flex-wrap:wrap}
.s-btn{background:#0f172a;color:#fff;border:1px solid #475569;padding:4px 8px;font-size:12px;border-radius:14px;margin:0}
.s-pop{min-height:22px;font-size:15px;font-weight:bold;color:#f472b6}
.rev{background:#0f172a;border-radius:8px;padding:10px;margin:10px 0;text-align:left;max-height:150px;overflow-y:auto;font-size:13px}
</style>
</head>
<body>
<div class="box">
  <h1>ターゲット1800 オンライン対戦 DX</h1>
  <div id="lobby">
    <div class="panel">
      <button id="bH" onclick="createRoom()">部屋を作る</button>
      <div id="rInfo" class="hide" style="margin-top:6px">合言葉：<b id="rId" style="font-size:22px;color:#38bdf8"></b></div>
    </div>
    <div class="panel">
      <input id="inId" placeholder="5桁の合言葉">
      <button id="bG" class="blue" onclick="joinRoom()">入室する</button>
    </div>
    <div id="log">待機中（ボタンを押してください）</div>
  </div>
  <div id="game" class="hide">
    <div style="display:flex;justify-content:space-between;font-weight:bold">
      <span style="color:#38bdf8">自分: <span id="sMe">0</span></span>
      <span id="prog">1/10</span>
      <span style="color:#f43f5e">相手: <span id="sOpp">0</span></span>
    </div>
    <div class="bar-bg"><div id="tBar" class="bar-fill"></div></div>
    <div id="sPop" class="s-pop"></div>
    <div style="background:#0f172a;padding:14px;border-radius:10px"><b id="word" style="font-size:32px;color:#facc15">READY</b></div>
    <div id="opts" class="grid"></div>
    <p id="gLog" style="font-weight:bold;color:#4ade80;min-height:20px;margin:6px 0"></p>
    <div id="rev" class="rev hide"></div>
    <button id="bRe" class="hide" onclick="reqRe()">もう一度対戦</button>
    <div class="s-bar">
      <button class="s-btn" onclick="sendSt('👍 ナイス！')">👍 ナイス！</button>
      <button class="s-btn" onclick="sendSt('🔥 速すぎ！')">🔥 速すぎ！</button>
      <button class="s-btn" onclick="sendSt('💦 しまった！')">💦 しまった！</button>
      <button class="s-btn" onclick="sendSt('👏 よろしく！')">👏 よろしく！</button>
    </div>
  </div>
</div>
<script>
var W=[
"abandon|〜を捨てる|〜を吸収する|〜を称賛する|〜を加速させる","absorb|〜を吸収する|〜を廃止する|〜を適応させる|〜を避難させる",
"accomplish|〜を成し遂げる|〜を伴う|〜を蓄積する|〜を非難する","accurate|正確な|急性の|十分な|人工の",
"acquire|〜を習得する|〜を要求する|〜を調査する|〜を賞賛する","adapt|適応する|〜を採用する|〜を崇拝する|〜を前進させる",
"adequate|十分な|隣接した|進歩した|熱心な","affection|愛情|影響|苦痛|親和性",
"alter|〜を変える|〜を交互にする|〜を警告する|〜を割り当てる","ambitious|野心的な|曖昧な|熱心な|匿名の",
"analyze|〜を分析する|〜に麻酔をかける|〜を公表する|〜を予期する","ancient|古代の|不安な|年間の|明らかな",
"anticipate|〜を予期する|〜に参加する|〜に謝罪する|〜を適用する","apparent|明らかな|適切な|熱心な|横柄な",
"appreciate|〜に感謝する|〜に近づく|〜を承認する|〜を逮捕する","appropriate|適切な|おおよその|横柄な|人工の",
"artificial|人工の|芸術的な|本質的な|熱心な","aspect|側面|尊敬|見込み|疑い",
"assemble|〜を組み立てる|〜に似ている|〜を割り当てる|〜を仮定する","assume|〜と思い込む|〜を保証する|〜を消費する|〜を再開する",
"astonish|〜を驚かせる|〜を攻撃する|〜に到達する|〜を添付する","attribute|〜のせいにする|〜を引きつける|〜を聴く|〜を自動化する",
"available|利用できる|避けられる|平均的な|気づいている","awkward|気まずい|素晴らしい|目覚めている|後ろ向きの",
"ban|〜を禁止する|〜を曲げる|〜を縛る|〜を爆発させる","barrier|障壁|樽|基礎|戦い",
"behave|振る舞う|信じる|所属する|利益を得る","betray|〜を裏切る|〜を打ち負かす|〜を懇願する|〜を曲げる",
"bother|〜を悩ます|〜を借りる|〜を跳ね返す|〜を自慢する","brief|簡潔な|明るい|勇敢な|広い",
"brilliant|素晴らしい|脆い|残忍な|退屈な","burden|重荷|埋葬|茂み|予算",
"calculate|〜を計算する|〜を祝う|〜を捕獲する|〜を彫る","capable|能力がある|注意深い|カジュアルな|慎重な",
"capture|〜を捕らえる|〜を運ぶ|〜を引き起こす|〜を中止する","cease|〜をやめる|〜を祝う|〜を主張する|〜を分類する",
"challenge|〜に異議を唱える|〜を変える|〜を請求する|〜を追い払う","circumstance|状況|円周|市民権|文明",
"collapse|崩壊する|収集する|衝突する|結合する","combine|〜を結合させる|〜を慰める|〜を命令する|〜を賞賛する",
"commit|（罪などを）犯す|〜を伝達する|〜を比較する|〜を競争する","companion|仲間|会社|比較|同情",
"compel|〜に強制する|〜を補償する|〜を競争する|〜を完了する","compensate|補償する|競争する|不平を言う|構成する",
"concentrate|集中する|結論づける|懸念する|確認する","concept|概念|関心|コンサート|結論",
"confess|告白する|確認する|混乱させる|征服する","confident|自信がある|機密の|対立する|混乱した",
"confirm|〜を確認する|〜に従う|〜を直面させる|〜を混雑させる","consequence|結果|良心|意識|節約"
];
var SV="https://ntfy.sh",tp="",host=0,id=String(Math.random()).slice(2,8),qs=[],ix=0,mS=0,oS=0,lk=0,ms=0,qT=0,tId,sId,wr=[],LM=6000;
function $(i){return document.getElementById(i)}
function log(t,e){$("log").textContent=t;$("log").style.color=e?"#f43f5e":"#4ade80"}
function post(t,ex){var d={s:id,t:t};if(ex)for(var k in ex)d[k]=ex[k];fetch(SV+"/"+tp,{method:"POST",body:JSON.stringify(d)}).catch(function(){log("送信エラー",1)})}
function sendSt(t){pop("自分: "+t,"#38bdf8");post("ST",{x:t})}
function pop(t,c){$("sPop").textContent=t;$("sPop").style.color=c;clearTimeout(sId);sId=setTimeout(function(){$("sPop").textContent=""},2000)}
function listen(){
  var es=new EventSource(SV+"/"+tp+"/sse");
  es.onopen=function(){if(!host){log("接続完了！開始待ち...");post("JN")}};
  es.onmessage=function(e){try{
    var m=JSON.parse(JSON.parse(e.data).message);if(m.s===id)return;
    if(m.t==="JN"&&host)newM();
    else if(m.t==="ST_M"){qs=m.q;start()}
    else if(m.t==="W"&&m.i===ix&&!lk){lk=1;clearInterval(tId);oS+=m.p;$("sOpp").textContent=oS;$("gLog").textContent="相手が正解！(+"+m.p+") 正解: "+qs[ix].j;$("gLog").style.color="#f43f5e";addW(qs[ix]);dis(1);setTimeout(function(){ix++;show()},1500)}
    else if(m.t==="M"&&m.i===ix){oS-=5;$("sOpp").textContent=oS;if(!ms){$("gLog").textContent="相手がお手つき！チャンス！";$("gLog").style.color="#4ade80"}}
    else if(m.t==="ST")pop("相手: "+m.x,"#f472b6");
    else if(m.t==="RE"&&host)newM();
  }catch(x){}};
}
function createRoom(){host=1;var c=String(Math.floor(10000+Math.random()*90000));tp="t18_"+c;$("rId").textContent=c;$("rInfo").classList.remove("hide");$("bH").disabled=$("bG").disabled=1;log("部屋を作成！入室待ち...");listen()}
function joinRoom(){var c=$("inId").value.trim();if(!c)return log("5桁の合言葉を入力",1);host=0;tp="t18_"+c;$("bH").disabled=$("bG").disabled=1;log("接続中...");listen()}
function newM(){
  qs=W.slice().sort(function(){return Math.random()-.5}).slice(0,10).map(function(l){
    var p=l.split("|");return{e:p[0],j:p[1],o:[p[1],p[2],p[3],p[4]].sort(function(){return Math.random()-.5})};
  });
  post("ST_M",{q:qs});start();
}
function start(){$("lobby").classList.add("hide");$("game").classList.remove("hide");$("bRe").classList.add("hide");$("rev").classList.add("hide");ix=mS=oS=0;wr=[];$("sMe").textContent=$("sOpp").textContent=0;show()}
function addW(q){for(var i=0;i<wr.length;i++)if(wr[i].e===q.e)return;wr.push(q)}
function show(){
  clearInterval(tId);
  if(ix>=qs.length){
    $("tBar").style.width="0%";$("word").textContent=mS>oS?"🏆 あなたの勝利！":mS<oS?"😢 相手の勝利...":"引き分け！";$("opts").innerHTML="";$("gLog").textContent="最終: 自分 "+mS+"点 vs 相手 "+oS+"点";$("bRe").classList.remove("hide");$("rev").classList.remove("hide");
    $("rev").innerHTML=wr.length?("<b style='color:#facc15'>📝 振り返りリスト</b>"+wr.map(function(x){return"<div><b>"+x.e+"</b> ： "+x.j+"</div>"}).join("")):"<div style='color:#4ade80;font-weight:bold'>🎉 全問クリア！復習不要です！</div>";
    return;
  }
  lk=ms=0;var q=qs[ix];$("prog").textContent=(ix+1)+"/"+qs.length;$("word").textContent=q.e;$("gLog").textContent="早押しで正解を選べ！";$("gLog").style.color="#94a3b8";$("opts").innerHTML="";
  q.o.forEach(function(opt){
    var b=document.createElement("button");b.className="choice";b.textContent=opt;
    b.onclick=function(){
      if(lk||ms)return;
      if(opt===q.j){lk=1;clearInterval(tId);var bn=Math.max(0,Math.round(((LM-(Date.now()-qT))/LM)*10)),pt=10+bn;mS+=pt;$("sMe").textContent=mS;$("gLog").textContent="正解！(+"+pt+"点 / 速度+"+bn+")";$("gLog").style.color="#38bdf8";dis(1);post("W",{i:ix,p:pt});setTimeout(function(){ix++;show()},1500)}
      else{ms=1;mS-=5;$("sMe").textContent=mS;$("gLog").textContent="お手つき！（-5点）";$("gLog").style.color="#facc15";addW(q);dis(1);post("M",{i:ix})}
    };
    $("opts").appendChild(b);
  });
  qT=Date.now();$("tBar").style.width="100%";$("tBar").style.backgroundColor="#4ade80";
  tId=setInterval(function(){
    var r=Math.max(0,LM-(Date.now()-qT)),pc=(r/LM)*100;$("tBar").style.width=pc+"%";
    $("tBar").style.backgroundColor=pc<30?"#f43f5e":pc<60?"#facc15":"#4ade80";
    if(r<=0&&!lk){lk=1;clearInterval(tId);dis(1);addW(q);$("gLog").textContent="時間切れ！ 正解: "+q.j;setTimeout(function(){ix++;show()},1500)}
  },50);
}
function dis(f){document.querySelectorAll(".choice").forEach(function(b){b.disabled=f})}
function reqRe(){if(host)newM();else{post("RE");$("gLog").textContent="再戦リクエスト送信中..."}}
</script>
</body>
</html>
