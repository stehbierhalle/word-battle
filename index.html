<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ターゲット1800 オンライン対戦</title>
  <style>
    body {
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Meiryo, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 { font-size: 22px; margin-top: 0; color: #facc15; }
    .lobby-box {
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .room-id-box {
      font-size: 26px;
      font-weight: bold;
      color: #38bdf8;
      background: #1e293b;
      padding: 10px 18px;
      border-radius: 8px;
      margin: 10px auto;
      display: inline-block;
      user-select: all;
      letter-spacing: 2px;
    }
    input[type="text"] {
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      border: 2px solid #38bdf8;
      background: #1e293b;
      color: #fff;
      width: 240px;
      text-align: center;
    }
    button {
      background: #facc15;
      color: #0f172a;
      border: none;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px 4px;
    }
    button:hover:not(:disabled) { background: #fde047; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .guest-btn { background: #38bdf8; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #334155;
    }
    .score-box {
      font-size: 18px;
      font-weight: bold;
      padding: 10px 16px;
      border-radius: 10px;
      width: 35%;
    }
    .me-box { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 2px solid #38bdf8; }
    .opp-box { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 2px solid #f43f5e; }
    .word-area {
      margin: 20px 0;
      padding: 24px;
      background: #0f172a;
      border-radius: 12px;
    }
    .english-word { font-size: 42px; font-weight: bold; letter-spacing: 2px; margin: 8px 0; color: #facc15; }
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
    }
    .choice-btn {
      background: #334155;
      color: #f8fafc;
      padding: 16px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      border: 2px solid transparent;
      cursor: pointer;
      width: 100%;
      margin: 0;
    }
    .choice-btn:hover:not(:disabled) { background: #475569; border-color: #38bdf8; }
    .choice-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .status-msg {
      min-height: 26px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 12px;
      color: #4ade80;
    }
    .hidden { display: none !important; }
    @media (max-width: 600px) {
      .choices { grid-template-columns: 1fr; }
      .english-word { font-size: 32px; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>ターゲット1800 オンライン対戦</h1>

  <!-- ロビー画面 -->
  <div id="lobby-screen">
    <div class="lobby-box">
      <div style="font-size: 14px; color: #94a3b8;">▼ 部屋を作って相手を待つ（ホスト側）</div>
      <button id="btn-create">新しい部屋を作成する</button>
      <div id="host-room-area" class="hidden">
        <div style="font-size: 13px; color: #cbd5e1; margin-top: 8px;">この「部屋ID」を相手に教えてください</div>
        <div class="room-id-box" id="created-room-id"></div>
        <br>
        <button id="btn-copy-id" style="background:#38bdf8;font-size:13px;padding:6px 14px;">IDをコピー</button>
      </div>
    </div>

    <div class="lobby-box">
      <div style="font-size: 14px; color: #94a3b8; margin-bottom: 10px;">▼ 相手の部屋に入る（ゲスト側）</div>
      <input type="text" id="join-id-input" placeholder="部屋IDを貼り付け">
      <button id="btn-join" class="guest-btn">入室して対戦開始</button>
    </div>

    <div class="status-msg" id="lobby-status" style="color: #94a3b8;">ボタンを押して部屋を作るか、IDを入れて入室してください</div>
  </div>

  <!-- ゲーム画面 -->
  <div id="game-screen" class="hidden">
    <div class="header">
      <div class="score-box me-box">自分: <span id="my-score">0</span> 点</div>
      <div style="font-size: 14px; color: #cbd5e1;" id="q-progress">準備中</div>
      <div class="score-box opp-box">相手: <span id="opp-score">0</span> 点</div>
    </div>

    <div class="word-area">
      <div class="english-word" id="word-display">READY</div>
    </div>

    <div class="choices" id="choices-container"></div>

    <div class="status-msg" id="game-status">対戦中...</div>
    <button id="rematch-btn" class="hidden">もう一度対戦する</button>
  </div>
</div>

<script>
  const wordBank = [
    { en: "abandon", ja: "〜を捨てる、断念する", d: ["〜を吸収する", "〜を称賛する", "〜を加速させる"] },
    { en: "absorb", ja: "〜を吸収する、夢中にさせる", d: ["〜を廃止する", "〜を適応させる", "〜を避難させる"] },
    { en: "accomplish", ja: "〜を成し遂げる", d: ["〜を伴う", "〜を蓄積する", "〜を非難する"] },
    { en: "accurate", ja: "正確な、的確な", d: ["急性の、激しい", "十分な", "人工の"] },
    { en: "acquire", ja: "〜を習得する、得る", d: ["〜を要求する", "〜を調査する", "〜に賞賛を与える"] },
    { en: "adapt", ja: "適応する、〜を適合させる", d: ["〜を採用する", "〜を崇拝する", "〜を前進させる"] },
    { en: "adequate", ja: "十分な、適切な", d: ["隣接した", "進歩した", "熱心な"] },
    { en: "affection", ja: "愛情、好意", d: ["影響、作用", "苦痛、悩み", "親和性"] },
    { en: "alter", ja: "〜を変える、変わる", d: ["〜を交互に行う", "〜を警告する", "〜を割り当てる"] },
    { en: "ambitious", ja: "野心的な、大志を抱いた", d: ["曖昧な", "熱心な", "匿名（とくめい）の"] },
    { en: "analyze", ja: "〜を分析する", d: ["〜に麻酔をかける", "〜を公表する", "〜を予期する"] },
    { en: "ancient", ja: "古代の、昔からの", d: ["不安な", "年間（毎年）の", "明らかな"] },
    { en: "anticipate", ja: "〜を予期する、楽しみに待つ", d: ["〜に参加する", "〜に謝罪する", "〜を適用する"] },
    { en: "apparent", ja: "明らかな、外見上の", d: ["適切な", "熱心な", "横柄な"] },
    { en: "appreciate", ja: "〜に感謝する、真価を認める", d: ["〜に近づく", "〜を承認する", "〜を逮捕する"] }
  ];

  // 通常のHTTPS通信（fetch）のみで同期するサーバーレス方式（jsonblob.com）
  const API_BASE = "https://jsonblob.com";
  let blobUrl = "";
  let isHost = false;
  let pollTimer = null;
  let roomState = null;
  let renderedQIdx = -1;
  let roundLocked = false;
  let myMissed = false;

  function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  function makeQuestions() {
    return shuffle([...wordBank]).slice(0, 10).map(q => ({
      en: q.en,
      ja: q.ja,
      options: shuffle([q.ja, ...q.d])
    }));
  }

  // ホスト：新しい部屋（JSONデータ）をHTTPSで作成
  document.getElementById("btn-create").onclick = async () => {
    const statusEl = document.getElementById("lobby-status");
    try {
      document.getElementById("btn-create").disabled = true;
      document.getElementById("btn-join").disabled = true;
      statusEl.textContent = "部屋を作成しています...";
      statusEl.style.color = "#facc15";

      isHost = true;
      const initialData = {
        status: "waiting",
        hostScore: 0,
        guestScore: 0,
        qIdx: 0,
        winner: null,
        hostMissed: false,
        guestMissed: false,
        questions: makeQuestions()
      };

      const res = await fetch(API_BASE, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(initialData)
      });

      if (!res.ok) throw new Error("サーバー応答エラー (" + res.status + ")");

      const locationHeader = res.headers.get("Location") || res.headers.get("x-jsonblob");
      let blobId = "";
      if (locationHeader) {
        blobId = locationHeader.split("/").pop();
      } else {
        const text = await res.text();
        blobId = text.trim();
      }

      if (!blobId) throw new Error("部屋IDの取得に失敗しました");

      blobUrl = `${API_BASE}/${blobId}`;
      document.getElementById("created-room-id").textContent = blobId;
      document.getElementById("host-room-area").classList.remove("hidden");
      statusEl.textContent = "部屋が完成しました！上のIDを相手に送ってお待ちください...";
      statusEl.style.color = "#4ade80";

      startPolling();
    } catch (err) {
      statusEl.textContent = "作成エラー: " + err.message;
      statusEl.style.color = "#f43f5e";
      document.getElementById("btn-create").disabled = false;
      document.getElementById("btn-join").disabled = false;
    }
  };

  document.getElementById("btn-copy-id").onclick = () => {
    const id = document.getElementById("created-room-id").textContent;
    navigator.clipboard.writeText(id);
    document.getElementById("lobby-status").textContent = "部屋IDをコピーしました！相手に送ってください";
  };

  // ゲスト：IDを使って部屋に参加
  document.getElementById("btn-join").onclick = async () => {
    const statusEl = document.getElementById("lobby-status");
    const blobId = document.getElementById("join-id-input").value.trim();
    if (!blobId) {
      alert("相手から送られた部屋IDを入力してください");
      return;
    }

    try {
      document.getElementById("btn-create").disabled = true;
      document.getElementById("btn-join").disabled = true;
      statusEl.textContent = "部屋に接続しています...";
      statusEl.style.color = "#38bdf8";

      isHost = false;
      blobUrl = `${API_BASE}/${blobId}`;

      const res = await fetch(blobUrl);
      if (!res.ok) throw new Error("部屋が見つかりません。IDを確認してください");
      const data = await res.json();

      data.status = "playing";
      await fetch(blobUrl, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      roomState = data;
      enterGameScreen();
      startPolling();
    } catch (err) {
      statusEl.textContent = "入室エラー: " + err.message;
      statusEl.style.color = "#f43f5e";
