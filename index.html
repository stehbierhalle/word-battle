<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ターゲット1800 オンライン対戦</title>
  <style>
    body { margin: 0; background: #0f172a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .box { width: 92%; max-width: 600px; background: #1e293b; padding: 24px; border-radius: 16px; text-align: center; box-sizing: border-box; }
    h1 { font-size: 22px; color: #facc15; margin-top: 0; }
    .panel { background: #0f172a; padding: 16px; border-radius: 12px; margin-bottom: 12px; }
    input { padding: 10px; font-size: 18px; border-radius: 8px; border: 2px solid #38bdf8; background: #1e293b; color: #fff; width: 160px; text-align: center; }
    button { background: #facc15; color: #000; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin: 5px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .blue { background: #38bdf8; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .choice { background: #334155; color: #fff; width: 100%; margin: 0; padding: 14px; }
    .hide { display: none; }
    #log { font-size: 15px; color: #4ade80; margin-top: 10px; font-weight: bold; min-height: 22px; }
  </style>
</head>
<body>
<div class="box">
  <h1>ターゲット1800 オンライン対戦</h1>

  <div id="lobby">
    <div class="panel">
      <div style="font-size:14px;color:#94a3b8;margin-bottom:8px;">▼ ホスト（部屋を作る）</div>
      <button id="btnHost" onclick="createRoom()">部屋を作る</button>
      <div id="roomInfo" class="hide" style="margin-top:10px;">
        合言葉：<span id="roomId" style="font-size:26px;font-weight:bold;color:#38bdf8;"></span>
      </div>
    </div>

    <div class="panel">
      <div style="font-size:14px;color:#94a3b8;margin-bottom:8px;">▼ ゲスト（部屋に入る）</div>
      <input type="text" id="inputId" placeholder="5桁の合言葉">
      <button id="btnGuest" class="blue" onclick="joinRoom()">入室する</button>
    </div>

    <div id="log">待機中（ボタンを押してください）</div>
  </div>

  <div id="game" class="hide">
    <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:bold;margin-bottom:12px;">
      <span style="color:#38bdf8;">自分: <span id="myScore">0</span></span>
      <span id="progress">1 / 10</span>
      <span style="color:#f43f5e;">相手: <span id="oppScore">0</span></span>
    </div>
    <div style="background:#0f172a;padding:20px;border-radius:12px;">
      <div id="word" style="font-size:36px;font-weight:bold;color:#facc15;">READY</div>
    </div>
    <div id="choices" class="grid"></div>
    <p id="gLog" style="font-weight:bold;color:#4ade80;min-height:24px;"></p>
    <button id="btnRematch" class="hide" onclick="reqRematch()">もう一度対戦する</button>
  </div>
</div>

<script>
var words = [
  { en: "abandon", ja: "〜を捨てる", d: ["〜を吸収する", "〜を称賛する", "〜を加速させる"] },
  { en: "absorb", ja: "〜を吸収する", d: ["〜を廃止する", "〜を適応させる", "〜を避難させる"] },
  { en: "accomplish", ja: "〜を成し遂げる", d: ["〜を伴う", "〜を蓄積する", "〜を非難する"] },
  { en: "accurate", ja: "正確な", d: ["急性の", "十分な", "人工の"] },
  { en: "acquire", ja: "〜を習得する", d: ["〜を要求する", "〜を調査する", "〜を賞賛する"] },
  { en: "adapt", ja: "適応する", d: ["〜を採用する", "〜を崇拝する", "〜を前進させる"] },
  { en: "adequate", ja: "十分な", d: ["隣接した", "進歩した", "熱心な"] },
  { en: "affection", ja: "愛情", d: ["影響", "苦痛", "親和性"] },
  { en: "alter", ja: "〜を変える", d: ["〜を交互にする", "〜を警告する", "〜を割り当てる"] },
  { en: "ambitious", ja: "野心的な", d: ["曖昧な", "熱心な", "匿名の"] },
  { en: "analyze", ja: "〜を分析する", d: ["〜に麻酔をかける", "〜を公表する", "〜を予期する"] },
  { en: "ancient", ja: "古代の", d: ["不安な", "年間の", "明らかな"] },
  { en: "anticipate", ja: "〜を予期する", d: ["〜に参加する", "〜に謝罪する", "〜を適用する"] },
  { en: "apparent", ja: "明らかな", d: ["適切な", "熱心な", "横柄な"] },
  { en: "appreciate", ja: "〜に感謝する", d: ["〜に近づく", "〜を承認する", "〜を逮捕する"] }
];

var SERVER = "https://ntfy.sh";
var topic = "";
var isHost = false;
var myId = String(Math.random()).slice(2, 8);
var qs = [];
var idx = 0;
var sMe = 0;
var sOpp = 0;
var locked = false;
var missed = false;

function setLog(txt, isErr) {
  var el = document.getElementById("log");
  el.textContent = txt;
  el.style.color = isErr ? "#f43f5e" : "#4ade80";
}

function sendMsg(type, extra) {
  var data = { sender: myId, type: type };
  if (extra) {
    for (var k in extra) { data[k] = extra[k]; }
  }
  fetch(SERVER + "/" + topic, {
    method: "POST",
    body: JSON.stringify(data)
  }).catch(function(e) {
    setLog("送信エラー: " + e.message, true);
  });
}

function startListen() {
  var es = new EventSource(SERVER + "/" + topic + "/sse");
  es.onopen = function() {
    if (!isHost) {
      setLog("接続完了！ホストの開始を待っています...");
      sendMsg("JOIN");
    }
  };
  es.onerror = function() {
    setLog("通信待機中またはネットワーク制限です", true);
  };
  es.onmessage = function(e) {
    try {
      var outer = JSON.parse(e.data);
      if (!outer.message) return;
      var msg = JSON.parse(outer.message);
      if (msg.sender === myId) return;

      if (msg.type === "JOIN" && isHost) {
        startNewMatch();
      } else if (msg.type === "START") {
        qs = msg.qs;
        beginGame();
      } else if (msg.type === "WIN" && msg.idx === idx && !locked) {
        locked = true;
        sOpp += 10;
        document.getElementById("oppScore").textContent = sOpp;
        document.getElementById("gLog").textContent = "相手が正解！ 正解: " + qs[idx].ja;
        setBtns(true);
        setTimeout(function() { idx++; showQ(); }, 1500);
      } else if (msg.type === "MISS" && msg.idx === idx) {
        sOpp -= 5;
        document.getElementById("oppScore").textContent = sOpp;
        document.getElementById("gLog").textContent = "相手がお手つき！（-5点）";
      } else if (msg.type === "REMATCH" && isHost) {
        startNewMatch();
      }
    } catch (err) {}
  };
}

function createRoom() {
  isHost = true;
  var code = String(Math.floor(10000 + Math.random() * 90000));
  topic = "t1800_battle_" + code;
  document.getElementById("roomId").textContent = code;
  document.getElementById("roomInfo").classList.remove("hide");
  document.getElementById("btnHost").disabled = true;
  document.getElementById("btnGuest").disabled = true;
  setLog("部屋を作成しました！相手の入室待ち...");
  startListen();
}

function joinRoom() {
  var code = document.getElementById("inputId").value.trim();
  if (!code) {
    setLog("5桁の合言葉を入力してください", true);
    return;
  }
  isHost = false;
  topic = "t1800_battle_" + code;
  document.getElementById("btnHost").disabled = true;
  document.getElementById("btnGuest").disabled = true;
  setLog("部屋に接続中...");
  startListen();
}

function startNewMatch() {
  var copy = words.slice().sort(function() { return Math.random() - 0.5; }).slice(0, 10);
  qs = copy.map(function(w) {
    var opts = [w.ja].concat(w.d).sort(function() { return Math.random() - 0.5; });
    return { en: w.en, ja: w.ja, opts: opts };
  });
  sendMsg("START", { qs: qs });
  beginGame();
}

function beginGame() {
  document.getElementById("lobby").classList.add("hide");
  document.getElementById("game").classList.remove("hide");
  document.getElementById("btnRematch").classList.add("hide");
  idx = 0;
  sMe = 0;
  sOpp = 0;
  document.getElementById("myScore").textContent = 0;
  document.getElementById("oppScore").textContent = 0;
  showQ();
}

function showQ() {
  if (idx >= qs.length) {
    var res = "引き分け！";
    if (sMe > sOpp) res = "🏆 あなたの勝利！";
    if (sOpp > sMe) res = "😢 相手の勝利...";
    document.getElementById("word").textContent = res;
    document.getElementById("choices").innerHTML = "";
    document.getElementById("gLog").textContent = "最終スコア: 自分 " + sMe + "点 vs 相手 " + sOpp + "点";
    document.getElementById("btnRematch").classList.remove("hide");
    return;
  }
  locked = false;
  missed = false;
  var q = qs[idx];
  document.getElementById("progress").textContent = (idx + 1) + " / " + qs.length;
  document.getElementById("word").textContent = q.en;
  document.getElementById("gLog").textContent = "";
  var box = document.getElementById("choices");
  box.innerHTML = "";
  q.opts.forEach(function(opt) {
    var b = document.createElement("button");
    b.className = "choice";
    b.textContent = opt;
    b.onclick = function() {
      if (locked || missed) return;
      if (opt === q.ja) {
        locked = true;
        sMe += 10;
        document.getElementById("myScore").textContent = sMe;
        document.getElementById("gLog").textContent = "正解！（+10点）";
        setBtns(true);
        sendMsg("WIN", { idx: idx });
        setTimeout(function() { idx++; showQ(); }, 1500);
      } else {
        missed = true;
        sMe -= 5;
        document.getElementById("myScore").textContent = sMe;
        document.getElementById("gLog").textContent = "お手つき！（-5点）";
        setBtns(true);
        sendMsg("MISS", { idx: idx });
      }
    };
    box.appendChild(b);
  });
}

function setBtns(flag) {
  var list = document.querySelectorAll(".choice");
  for (var i = 0; i < list.length; i++) {
    list[i].disabled = flag;
  }
}

function reqRematch() {
  if (isHost) {
    startNewMatch();
  } else {
    sendMsg("REMATCH");
    document.getElementById("gLog").textContent = "ホストに再戦をリクエストしました...";
  }
}
</script>
</body>
</html>
