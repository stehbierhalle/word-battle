<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ターゲット1800 オンライン対戦</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
    .box { max-width: 600px; margin: 20px auto; background: #1e293b; padding: 24px; border-radius: 14px; }
    button { padding: 12px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin: 6px; background: #facc15; color: #000; }
    button:active { transform: scale(0.98); }
    textarea { width: 100%; height: 65px; margin-top: 8px; background: #0f172a; color: #38bdf8; border: 1px solid #334155; border-radius: 6px; padding: 8px; box-sizing: border-box; font-size: 12px; }
    .hidden { display: none; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .choice { background: #334155; color: #fff; width: 100%; margin: 0; padding: 16px; }
    .choice:disabled { opacity: 0.4; cursor: not-allowed; }
    .copy { background: #38bdf8; font-size: 13px; padding: 8px 14px; }
  </style>
</head>
<body>
<div class="box">
  <h2>ターゲット1800 オンライン対戦</h2>
  <div id="lobby">
    <button id="b-host">部屋を作る（ホスト）</button>
    <button id="b-guest" style="background:#38bdf8;">部屋に入る（ゲスト）</button>

    <div id="p-host" class="hidden">
      <p>① 下の招待コードをコピーして相手に送る</p>
      <textarea id="t-offer" readonly></textarea>
      <button id="c-offer" class="copy">招待コードをコピー</button>
      <p>② 相手の参加コードを貼って接続</p>
      <textarea id="t-ans-in" placeholder="ここに貼り付け"></textarea>
      <button id="b-conn">接続して開始</button>
    </div>

    <div id="p-guest" class="hidden">
      <p>① 相手の招待コードを貼って生成</p>
      <textarea id="t-off-in" placeholder="ここに貼り付け"></textarea>
      <button id="b-make">参加コード生成</button>
      <p>② 下の参加コードを相手に送り返す</p>
      <textarea id="t-ans" readonly></textarea>
      <button id="c-ans" class="copy">参加コードをコピー</button>
    </div>

    <p id="msg" style="color:#4ade80; font-weight:bold;">役割を選んでください</p>
  </div>

  <div id="game" class="hidden">
    <div style="display:flex;justify-content:space-between;font-size:20px;font-weight:bold;">
      <span style="color:#38bdf8;">自分: <span id="s1">0</span></span>
      <span id="qnum">1/10</span>
      <span style="color:#f43f5e;">相手: <span id="s2">0</span></span>
    </div>
    <h1 id="word" style="font-size:40px;color:#facc15;margin:20px 0;">READY</h1>
    <div id="opts" class="grid"></div>
    <p id="gmsg" style="font-weight:bold; min-height:24px;"></p>
    <button id="b-re" class="hidden">もう一度対戦する</button>
  </div>
</div>

<script>
const words = [
  {en:"abandon", ja:"〜を捨てる", d:["〜を吸収する","〜を称賛する","〜を加速させる"]},
  {en:"absorb", ja:"〜を吸収する", d:["〜を廃止する","〜を適応させる","〜を避難させる"]},
  {en:"accomplish", ja:"〜を成し遂げる", d:["〜を伴う","〜を蓄積する","〜を非難する"]},
  {en:"accurate", ja:"正確な", d:["急性の","十分な","人工の"]},
  {en:"acquire", ja:"〜を習得する", d:["〜を要求する","〜を調査する","〜を賞賛する"]},
  {en:"adapt", ja:"適応する", d:["〜を採用する","〜を崇拝する","〜を前進させる"]},
  {en:"adequate", ja:"十分な", d:["隣接した","進歩した","熱心な"]},
  {en:"affection", ja:"愛情", d:["影響","苦痛","親和性"]},
  {en:"alter", ja:"〜を変える", d:["〜を交互にする","〜を警告する","〜を割り当てる"]},
  {en:"ambitious", ja:"野心的な", d:["曖昧な","熱心な","匿名の"]}
];

let pc, dc, host=false, qs=[], idx=0, s1=0, s2=0, lock=false, miss=false;
const $ = id => document.getElementById(id);

$("b-host").onclick = async () => {
  host = true;
  $("p-host").classList.remove("hidden");
  $("p-guest").classList.add("hidden");
  $("msg").textContent = "招待コードを生成中...";
  pc = new RTCPeerConnection({iceServers:[{urls:"stun:://google.com"}]});
  dc = pc.createDataChannel("g");
  setupDC();
  let done = false;
  const finish = () => {
    if(done || !pc.localDescription) return;
    done = true;
    $("t-offer").value = btoa(encodeURIComponent(JSON.stringify(pc.localDescription)));
    $("msg").textContent = "招待コードをコピーして相手に送ってください";
  };
  pc.onicecandidate = e => { if(!e.candidate) finish(); };
  await pc.setLocalDescription(await pc.createOffer());
  setTimeout(finish, 2000);
};

$("b-guest").onclick = () => {
  host = false;
  $("p-guest").classList.remove("hidden");
  $("p-host").classList.add("hidden");
  $("msg").textContent = "招待コードを貼り付けてください";
  pc = new RTCPeerConnection({iceServers:[{urls:"stun:://google.com"}]});
  pc.ondatachannel = e => { dc = e.channel; setupDC(); };
};

$("b-make").onclick = async () => {
  try {
    $("msg").textContent = "参加コードを生成中...";
    await pc.setRemoteDescription(JSON.parse(decodeURIComponent(atob($("t-off-in").value.trim()))));
    let done = false;
    const finish = () => {
      if(done || !pc.localDescription) return;
      done = true;
      $("t-ans").value = btoa(encodeURIComponent(JSON.stringify(pc.localDescription)));
      $("msg").textContent = "参加コードをコピーして相手に送り返してください";
    };
    pc.onicecandidate = e => { if(!e.candidate) finish(); };
    await pc.setLocalDescription(await pc.createAnswer());
    setTimeout(finish, 2000);
  } catch(e) { alert("招待コードが正しくありません"); }
};

$("b-conn").onclick = async () => {
  try {
    $("msg").textContent = "接続中...";
    await pc.setRemoteDescription(JSON.parse(decodeURIComponent(atob($("t-ans-in").value.trim()))));
  } catch(e) { alert("参加コードが正しくありません"); }
};

$("c-offer").onclick = () => { navigator.clipboard.writeText($("t-offer").value); $("msg").textContent = "招待コードをコピーしました！"; };
$("c-ans").onclick = () => { navigator.clipboard.writeText($("t-ans").value); $("msg").textContent = "参加コードをコピーしました！"; };

function setupDC() {
  dc.onopen = () => {
    $("lobby").classList.add("hidden");
    $("game").classList.remove("hidden");
    if(host) startMatch();
  };
  dc.onmessage = e => {
    const d = JSON.parse(e.data);
    if(d.t==="S") { qs=d.qs; idx=0; s1=0; s2=0; $("s1").textContent=0; $("s2").textContent=0; $("b-re").classList.add("hidden"); showQ(); }
    if(d.t==="W" && !lock) { lock=true; s2+=10; $("s2").textContent=s2; $("gmsg").textContent="相手が正解！"; setBtns(true); next(); }
    if(d.t==="M") { s2-=5; $("s2").textContent=s2; $("gmsg").textContent="相手がお手つき！"; }
    if(d.t==="R" && host) { startMatch(); }
  };
}

function startMatch() {
  qs = [...words].sort(()=>Math.random()-0.5).map(w => ({en:w.en, ja:w.ja, o:[w.ja,...w.d].sort(()=>Math.random()-0.5)}));
  idx=0; s1=0; s2=0; $("s1").textContent=0; $("s2").textContent=0; $("b-re").classList.add("hidden");
  dc.send(JSON.stringify({t:"S", qs}));
  showQ();
}

function showQ() {
  if(idx>=qs.length) {
    $("word").textContent = s1>s2?"🏆 勝利！":s1<s2?"😢 敗北...":"引き分け";
    $("opts").innerHTML="";
    $("b-re").classList.remove("hidden");
    return;
  }
  lock=false; miss=false;
  const q = qs[idx];
  $("qnum").textContent = (idx+1)+"/"+qs.length;
  $("word").textContent = q.en;
  $("gmsg").textContent = "";
  $("opts").innerHTML = "";
  q.o.forEach(txt => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = txt;
    b.onclick = () => {
      if(lock || miss) return;
      if(txt===q.ja) { lock=true; s1+=10; $("s1").textContent=s1; $("gmsg").textContent="正解！"; setBtns(true); dc.send(JSON.stringify({t:"W"})); next(); }
      else { miss=true; s1-=5; $("s1").textContent=s1; $("gmsg").textContent="お手つき！"; setBtns(true); dc.send(JSON.stringify({t:"M"})); }
    };
    $("opts").appendChild(b);
  });
}

function setBtns(dis) { document.querySelectorAll(".choice").forEach(b => b.disabled = dis); }
function next() { setTimeout(()=>{ idx++; showQ(); }, 1200); }
$("b-re").onclick = () => { if(host) startMatch(); else { dc.send(JSON.stringify({t:"R"})); $("gmsg").textContent="再戦リクエスト送信中..."; } };
</script>
</body>
</html>
